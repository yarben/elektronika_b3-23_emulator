<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JavaScript Calculator</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="author" content="Anton" />
    <meta name="keywords" content="Calculator JavaScript" />
    <meta name="description" content="Calculator project" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
  
    
    <div class="calculator">
      
      <div class="calculator__body">
        <div class="iframe-container">
          <iframe src="./instr.html" frameborder="0" width="100%" height="500"></iframe>
        </div>
        <div id="myCalc">
          <div class="top"></div>
          
          <div class="screen-section">
            <div class="screen-holder">
              <div class="screen">
                <p class="screen-item digit">-</p>
                <p class="screen-item digit">8</p>
                <p class="screen-item dot">.</p>
                <p class="screen-item digit">8</p>
                <p class="screen-item dot">.</p>
                <p class="screen-item digit">8</p>
                <p class="screen-item dot">.</p>
                <p class="screen-item digit">8</p>
                <p class="screen-item dot">.</p>
                <p class="screen-item digit">8</p>
                <p class="screen-item dot">.</p>
                <p class="screen-item digit">8</p>
                <p class="screen-item dot">.</p>
                <p class="screen-item digit">8</p>
                <p class="screen-item dot">.</p>
                <p class="screen-item digit">8</p>
                <p class="screen-item dot">.</p>
              </div>
            </div>
          </div>
          <div class="border"></div>
          <div class="keyboard">
            <div class="switch-row">
              <div class="onoffswitch">
                <input
                  type="checkbox"
                  name="onoffswitch"
                  class="onoffswitch-checkbox"
                  id="myonoffswitch"
                />
                <label class="onoffswitch-label" for="myonoffswitch">
                  <span class="onoffswitch-inner"></span>
                  <span class="onoffswitch-switch"></span>
                </label>
              </div>
              <p id="label">ЭЛЕКТРОНИКА</p>
            </div>
	    <style>
  		.switch-row {
    			display: flex;
    			align-items: center;
  		}

  		#label {
    			margin-left: 74px; /* Отступ вправо */
  		}
	    </style>
            <div class="keys">
              <button id="clear" class="big-button" value="C">C</button>
              <button id= "perc" class="math-button" value="percent">&#37;</button>
              <button class="math-button big-button" value="+">+</button>
              <button value="7">7</button>
              <button value="8">8</button>
              <button value="9">9</button>
              <button class="math-button" value="-">-</button>
              <button value="4">4</button>
              <button value="5">5</button>
              <button value="6">6</button>
              <button class="math-button" value="x">x</button>
              <button value="1">1</button>
              <button value="2">2</button>
              <button value="3">3</button>
              <button class="math-button" value="/">&divide</button>
              <button class="big-button" value="0">0</button>
              <button id="dot-button" value=".">.</button>
              <button
                id="equal-button"
                class="math-button big-button"
                value="="
              >
                =
              </button>
            </div>
          </div>
        </div>
        
        <div class="registers-area">
          <div id="registers">
            <div class="register" id="register_x">
              <label>X =</label>
              <div class="register-display">
                <p class="register-digit">00000000</p>
              </div>
            </div>
            <div class="register" id="register_y">
              <label>Y =</label>
              <div class="register-display">
                <p class="register-digit">00000000</p>
              </div>
            </div>
            <div class="register" id="register_c">
              <label>C =</label>
              <div class="register-display">
                <p class="register-digit">00000000</p>
              </div>
            </div>
            <div class="register" id="register_operation">
              <label>0 = </label>
              <div class="register-display">
                <p class="register-digit">0</p>
              </div>
            </div>
          </div>

          <div id="flags">
            <div class="flag">
              <label>fE:</label>
              <span id="flag_overflow">0</span>
            </div>
            <div class="flag">
              <label>f0:</label>
              <span id="flag_change_operation">0</span>
            </div>
            <div class="flag">
              <label>f4:</label>
              <span id="flag_change_number">0</span>
            </div>
          </div>

        </div>
        
        
      </div>

      <!-- partial -->
      <script src="./script.js"></script>
    </div>
  </body>
</html>
